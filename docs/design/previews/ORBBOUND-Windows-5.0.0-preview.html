.dm-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: auto;
  color: var(--text, #e8ecef);
  background: rgb(6 12 21 / 68%);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  opacity: 0;
  transition: opacity 200ms ease;
  font-family: inherit;
}

.dm-overlay *, .dm-overlay *::before, .dm-overlay *::after { box-sizing: border-box; }
.dm-lan-summary{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 26px;padding:22px 0;background:rgba(0,0,0,.08);border-radius:12px;color:var(--muted);font-size:11px}.dm-lan-summary span{display:flex;flex-direction:column;gap:7px}.dm-lan-summary strong{font-size:26px;font-weight:500;color:var(--text)}
.dm-overlay.dm-visible { opacity: 1; }
.dm-overlay.dm-leaving { pointer-events: none; transition-duration: 150ms; }
.dm-panel {
  position: relative;
  width: min(100%, 416px);
  margin: auto;
  padding: 38px 32px 27px;
  border: 1px solid rgb(147 166 191 / 13%);
  border-radius: 20px;
  background: var(--panel, #192335);
  box-shadow: 0 28px 80px rgb(3 9 17 / 32%);
  text-align: center;
  outline: none;
  transform: translateY(10px);
  transition: transform 200ms cubic-bezier(.2,.8,.2,1);
}
.dm-visible .dm-panel { transform: translateY(0); }
.dm-leaving .dm-panel { transform: translateY(6px); transition-duration: 150ms; }
.dm-panel--leaderboard { width: min(100%, 466px); }
.dm-heading { margin-bottom: 27px; }
.dm-eyebrow { margin: 0 0 12px; color: var(--mint, #91cdb9); font-size: 12px; line-height: 1.5; }
.dm-title { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.35; letter-spacing: -.7px; }
.dm-subtitle { margin: 10px 0 0; color: var(--muted, #94a2b4); font-size: 13px; line-height: 1.6; }
.dm-close {
  position: absolute;
  right: 13px;
  top: 11px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  padding: 0 0 2px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted, #94a2b4);
  font-family: inherit;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease;
}
.dm-close:hover { color: var(--text, #e8ecef); background: rgb(230 240 245 / 5%); }
.dm-actions { display: grid; gap: 10px; }
.dm-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 12px 19px;
  border: 0;
  border-radius: 11px;
  background: #243044;
  color: var(--text, #e8ecef);
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
  cursor: pointer;
  transition: transform 160ms ease, background 160ms ease;
}
.dm-button:hover { background: #2b384c; transform: translateY(-1px); }
.dm-button:active { transform: translateY(0) scale(.98); }
.dm-button--primary { color: #10251f; background: var(--mint, #91cdb9); font-weight: 650; }
.dm-button--primary:hover { background: #a4dac8; }
.dm-bottom-actions { display: flex; justify-content: center; gap: 20px; margin-top: 18px; }
.dm-bottom-actions .dm-button { padding: 7px 4px; min-height: 32px; background: transparent; color: var(--muted, #94a2b4); font-size: 12px; }
.dm-bottom-actions .dm-button:hover { color: var(--text, #e8ecef); }
.dm-pause-meta { display: flex; align-items: center; justify-content: space-between; padding: 0 1px 23px; margin-top: -3px; font-size: 14px; color: var(--muted, #94a2b4); }
.dm-pause-meta .dm-number { color: var(--text, #e8ecef); font-size: 21px; font-weight: 550; }
.dm-pause-meta small { color: var(--muted, #94a2b4); font-size: 12px; font-weight: 400; }
.dm-number, .dm-score-value, .dm-result-meta strong { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
.dm-stars { display: flex; justify-content: center; align-items: center; gap: 17px; margin: 0 0 15px; padding-top: 5px; }
.dm-star { color: #364052; font-size: 35px; line-height: 1.1; }
.dm-star--earned { color: var(--gold, #d8b96b); }
.dm-visible .dm-star--earned { animation: dm-star-in 420ms var(--dm-star-delay) cubic-bezier(.2,.8,.2,1) both; }
.dm-star:nth-child(2) { font-size: 44px; transform: translateY(-5px); }
.dm-panel--victory .dm-heading, .dm-panel--defeat .dm-heading { margin-bottom: 25px; }
.dm-score { display: flex; flex-direction: column; align-items: center; }
.dm-score-label { font-size: 12px; color: var(--muted, #94a2b4); }
.dm-score-value { display: block; margin: 5px 0 4px; font-size: 48px; font-weight: 550; letter-spacing: -1.7px; line-height: 1.25; }
.dm-score-detail { color: var(--muted, #94a2b4); font-size: 12px; }
.dm-score-detail span { display: inline-block; margin: 0 5px; color: #738297; }
.dm-result-meta { display: flex; justify-content: center; gap: 29px; margin: 26px 0 28px; color: var(--muted, #94a2b4); font-size: 12px; }
.dm-result-meta strong { margin-left: 6px; color: var(--text, #e8ecef); font-size: 13px; font-weight: 500; }
.dm-fall-symbol { position: relative; width: 76px; height: 51px; margin: 0 auto 19px; }
.dm-fall-ball { display: block; position: absolute; left: 25px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--coral, #dd8e8f); }
.dm-fall-line { position: absolute; left: 0; bottom: 4px; width: 76px; height: 1px; background: rgb(221 142 143 / 55%); }
.dm-visible .dm-fall-ball { animation: dm-ball-settle 460ms 160ms cubic-bezier(.2,.8,.2,1) both; }
.dm-panel--defeat .dm-title { color: #e2d5d7; }
.dm-filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 11px; background: rgb(7 14 26 / 35%); margin-bottom: 19px; }
.dm-filter { display: flex; justify-content: center; align-items: baseline; gap: 6px; padding: 10px 4px; border: 0; border-radius: 8px; color: var(--muted, #94a2b4); font: inherit; font-size: 13px; background: transparent; cursor: pointer; transition: background 150ms ease, color 150ms ease; }
.dm-filter span { font-size: 10px; opacity: .8; }
.dm-filter[aria-selected='true'] { color: var(--text, #e8ecef); background: #2b374a; }
.dm-filter:hover { color: var(--text, #e8ecef); }
.dm-ranking { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
.dm-ranking thead th { padding: 0 11px 11px; font-size: 10px; font-weight: 400; color: var(--muted, #94a2b4); }
.dm-ranking th:first-child { width: 63px; }
.dm-ranking th:last-child, .dm-ranking td:last-child { text-align: right; }
.dm-ranking td { height: 45px; padding: 8px 11px; }
.dm-ranking .dm-rank { color: var(--muted, #94a2b4); font-size: 11px; font-variant-numeric: tabular-nums; }

  <script type="module">
const {OrbScene,ORB_COLORS}=(()=>{
// Standalone visual study. Nothing in the Snood 4.7.0 application is imported.
const W = 640;
const H = 760;
const R = 19;
const DX = 42;
const DY = Math.sqrt(3) * DX / 2;
const TOP = 39;
const COLS = 14;
const ORIGIN = { x: 320, y: 693 };
const KEYS = ['coral', 'mint', 'gold', 'violet', 'blue', 'rose'];

const ORB_COLORS = {
  coral: { base: '#df827e', light: '#e08884', dark: '#c37474', ink: '#693c3b' },
  mint: { base: '#76bdab', light: '#7cc0af', dark: '#68a79b', ink: '#2a584b' },
  gold: { base: '#d7b86c', light: '#d9bb73', dark: '#bca364', ink: '#66552c' },
  violet: { base: '#a18bd3', light: '#a590d5', dark: '#8d7cbd', ink: '#493b67' },
  blue: { base: '#77a5cf', light: '#7da9d1', dark: '#6993ba', ink: '#2e4c68' },
  rose: { base: '#ca8da9', light: '#cc92ad', dark: '#b17e99', ink: '#61394d' },
};

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const cellKey = (row, col) => `${row}:${col}`;
const pos = (row, col) => ({ x: 37 + col * DX + (row % 2 ? DX / 2 : 0), y: TOP + row * DY });

class OrbScene {
  constructor(canvas, { onState = () => {}, onEvent = () => {}, reducedMotion = false } = {}) {
    if (!canvas || !canvas.getContext) throw new TypeError('OrbScene requires a canvas');
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.onState = onState;
    this.onEvent = onEvent;
    this.reducedMotion = Boolean(reducedMotion);
    this.destroyed = false;
    this.angle = -Math.PI / 2;
    this.nextId = 1;
    this.lastFrame = 0;
    this.dpr = 1;
    this.guide = [];
    this.pointerDown = false;
    this._onMove = (event) => this._point(event);
    this._onDown = (event) => {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      this._point(event);
      this.fire();
    };
    this.canvas.addEventListener('pointermove', this._onMove);
    this.canvas.addEventListener('pointerdown', this._onDown);
    this.canvas.style.touchAction = 'none';
    this._resize = () => {
      const rect = this.canvas.getBoundingClientRect();
      this.dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.canvas.width = Math.round((rect.width || W) * this.dpr);
      this.canvas.height = Math.round((rect.height || H) * this.dpr);
      this._render();
    };
    this.observer = typeof ResizeObserver === 'function' ? new ResizeObserver(this._resize) : null;
    if (this.observer) this.observer.observe(this.canvas);
    else window.addEventListener('resize', this._resize);
    this.reset();
    this._resize();
    this._frame = (timestamp) => {
      if (this.destroyed) return;
      const dt = this.lastFrame ? Math.min((timestamp - this.lastFrame) / 1000, 0.035) : 0;
      this.lastFrame = timestamp;
      if (!this.state.paused) this._update(dt);
      this._render();
      this.raf = requestAnimationFrame(this._frame);
    };
    this.raf = requestAnimationFrame(this._frame);
  }

  getState() { return { ...this.state }; }

  setPaused(value) {
    this.state.paused = Boolean(value);
    this._emit();
    this._render();
  }

  setReducedMotion(value) {
    this.reducedMotion = Boolean(value);
    if (this.reducedMotion) {
      this.particles = [];
      this.falling = [];
      this.board.forEach((ball) => { ball.shift = 0; });
    }
    this._render();
  }

  setLowMotion(value) { this.setReducedMotion(value); }

  reset() {
    this.time = 0;
    this.elapsedTime = 0;
    this.board = [];
    this.particles = [];
    this.falling = [];
    this.rings = [];
    this.labels = [];
    this.tasks = [];
    this.projectile = null;
    this.recoil = 0;
    this.rowMoving = 0;
    this.load = 1;
    this.dangerPulse = 0;
    this.terminalEffect = null;
    this.comboWindow = -100;
    this.demoBusy = false;
    this.shots = 0;
    this.state = {
      score: 12480,
      elapsed: 0,
      shotsUntilDrop: 6,
      currentColor: 'mint',
      nextColor: 'coral',
      combo: 0,
      paused: false,
      shooting: false,
      status: 'playing',
      dangerActive: false,
      dangerPreview: false,
    };
    this._seedBoard();
    this._updateGuide();
    this._emit();
    this._render();
  }

  fire() {
    if (this.destroyed || this.state.paused || this.state.status !== 'playing' || this.projectile || this.demoBusy || this.rowMoving > 0 || this.load < 0.99) return false;
    const speed = 920;
    const start = this._muzzle();
    this.projectile = { x: start.x, y: start.y, vx: Math.cos(this.angle) * speed, vy: Math.sin(this.angle) * speed, color: this.state.currentColor, trail: [] };
    this.recoil = 0.14;
    this.load = 0;
    this.state.shooting = true;
    this.shots += 1;
    this.state.shotsUntilDrop -= 1;
    this.onEvent({ type: 'shot', color: this.state.currentColor, shotsUntilDrop: this.state.shotsUntilDrop });
    this._emit();
    return true;
  }

  demoCombo() {
    if (!this._canShowcase()) return false;
    this.demoBusy = true;
    // A short, repeatable showcase: gather a connected group on the bottom edge.
    if (this.board.length < 22) this._seedBoard();
    const anchor = [...this.board].sort((a, b) => (b.y - a.y) || (Math.abs(a.x - 320) - Math.abs(b.x - 320)))[0];
    const chosen = [...this.board].sort((a, b) => dist(a, anchor) - dist(b, anchor)).slice(0, 6);
    const selected = new Set(chosen.map((ball) => ball.id));
    const hanging = [...this.board].filter((ball) => !selected.has(ball.id) && ball.row >= anchor.row - 1)
      .sort((a, b) => dist(a, anchor) - dist(b, anchor)).slice(0, 4);
    chosen.forEach((ball) => { ball.color = 'mint'; ball.pulse = 0.22; });
    this._schedule(0.2, () => {
      this._removeGroup(chosen, hanging, true);
      this._schedule(0.48, () => { this.demoBusy = false; });
    });
    this._updateGuide();
    return true;
  }

  demoDanger() {
    if (this.state.paused || this.state.status !== 'playing') return false;
    this.dangerPulse = 2.5;
    this.state.dangerActive = true;
    this.state.dangerPreview = true;
    this.onEvent({ type: 'danger', active: true, demo: true });
    this._emit();
    return true;
  }

  demoVictory() { return this._finish('victory'); }
  demoDefeat() { return this._finish('defeat', true); }

  destroy() {
    this.destroyed = true;
    cancelAnimationFrame(this.raf);
    this.canvas.removeEventListener('pointermove', this._onMove);
    this.canvas.removeEventListener('pointerdown', this._onDown);
    if (this.observer) this.observer.disconnect();
    else window.removeEventListener('resize', this._resize);
    this.tasks = [];
  }

  _emit() { this.onState(this.getState()); }
  _schedule(delay, action) { this.tasks.push({ at: this.time + delay, action }); }
  _canShowcase() { return !this.destroyed && !this.state.paused && this.state.status === 'playing' && !this.projectile && !this.demoBusy; }

  _seedBoard() {
    this.board = [];
    for (let row = 0; row < 6; row += 1) {
      for (let col = 0; col < COLS; col += 1) {
        if (row === 5 && (col < 2 || col > 10 || col === 7)) continue;
        if (row === 4 && (col === 0 || col === 13)) continue;
        const color = KEYS[(Math.floor(col / 2) + Math.floor(row / 2) * 2 + (row === 5 ? 1 : 0)) % KEYS.length];
        this.board.push(this._ball(row, col, color));
      }
    }
  }

  _ball(row, col, color) {
    return { id: this.nextId++, row, col, ...pos(row, col), color, appear: 1, pulse: 0 };
  }

  _point(event) {
    if (this.state.paused || this.state.status !== 'playing') return;
    const rect = this.canvas.getBoundingClientRect();
    const px = (event.clientX - rect.left) / rect.width * W;
    const py = (event.clientY - rect.top) / rect.height * H;
    if (!Number.isFinite(px) || !Number.isFinite(py)) return;
    this.angle = clamp(Math.atan2(Math.min(py, ORIGIN.y - 68) - ORIGIN.y, px - ORIGIN.x), -Math.PI + 0.19, -0.19);
    this._updateGuide();
  }

  _muzzle() { return { x: ORIGIN.x + Math.cos(this.angle) * 31, y: ORIGIN.y + Math.sin(this.angle) * 31 }; }

  _updateGuide() {
    const p = this._muzzle();
    let vx = Math.cos(this.angle) * 6;
    const vy = Math.sin(this.angle) * 6;
    this.guide = [{ ...p }];
    let walked = 0;
    let bounces = 0;
    for (let i = 0; i < 230; i += 1) {
      p.x += vx;
      p.y += vy;
      walked += 6;
      if (p.x < R || p.x > W - R) { p.x = clamp(p.x, R, W - R); vx *= -1; bounces += 1; }
      if (walked >= 21) { this.guide.push({ ...p }); walked = 0; }
      if (p.y < TOP || this.board.some((ball) => dist(ball, p) < R * 2 + 1) || bounces > 1) break;
    }
  }

  _update(dt) {
    this.time += dt;
    if (this.state.status === 'playing') {
      this.elapsedTime += dt;
      const sec = Math.floor(this.elapsedTime);
      if (this.state.elapsed !== sec) { this.state.elapsed = sec; this._emit(); }
    }
    const ready = this.tasks.filter((task) => task.at <= this.time);
    this.tasks = this.tasks.filter((task) => task.at > this.time);
    ready.forEach((task) => task.action());
    this.recoil = Math.max(0, this.recoil - dt);
    this.rowMoving = Math.max(0, this.rowMoving - dt);
    if (!this.projectile) this.load = Math.min(1, this.load + dt / 0.22);
    if (this.dangerPulse > 0) {
      this.dangerPulse = Math.max(0, this.dangerPulse - dt);
      if (!this.dangerPulse) {
        this.state.dangerPreview = false;
        this.state.dangerActive = this.board.some((ball) => ball.y > 535);
        this._emit();
      }
    }
    if (this.projectile) this._moveShot(dt);
    this.board.forEach((ball) => {
      ball.appear = Math.min(1, ball.appear + dt / 0.16);
      ball.pulse = Math.max(0, ball.pulse - dt);
      if (ball.shift) ball.shift = Math.max(0, ball.shift - dt / 0.28);
    });
    this.particles.forEach((particle) => {
      particle.life -= dt;
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.vy += particle.gravity * dt;
      particle.angle += particle.spin * dt;
    });
    this.particles = this.particles.filter((particle) => particle.life > 0);
    this.falling.forEach((ball) => {
      ball.life -= dt;
      ball.y += ball.vy * dt;
      ball.x += ball.vx * dt;
      ball.vy += 900 * dt;
      ball.spin += ball.vx * dt * 0.012;
    });
    this.falling = this.falling.filter((ball) => ball.life > 0 && ball.y < H + R);
    this.rings.forEach((ring) => { ring.t += dt; });
    this.rings = this.rings.filter((ring) => ring.t < ring.duration);
    this.labels.forEach((label) => { label.t += dt; });
    this.labels = this.labels.filter((label) => label.t < label.duration);
    if (this.terminalEffect) this.terminalEffect.t += dt;
  }

  _moveShot(dt) {
    const shot = this.projectile;
    const steps = Math.ceil(dt * 920 / 7);
    const step = dt / Math.max(1, steps);
    for (let i = 0; i < steps && this.projectile; i += 1) {
      shot.x += shot.vx * step;
      shot.y += shot.vy * step;
      if (shot.x <= R || shot.x >= W - R) {
        shot.x = clamp(shot.x, R, W - R);
        shot.vx *= -1;
        if (!this.reducedMotion) this.rings.push({ x: shot.x, y: shot.y, t: 0, duration: 0.24, color: shot.color, radius: 13 });
      }
      const hit = this.board.find((ball) => dist(ball, shot) <= R * 2 + 1);
      if (hit || shot.y <= TOP) { this._settleShot(shot, hit); break; }
    }
    if (this.projectile) {
      shot.trail.push({ x: shot.x, y: shot.y });
      if (shot.trail.length > 5) shot.trail.shift();
    }
  }

  _neighborCells(row, col) {
    const side = row % 2 ? 1 : -1;
    return [[row, col - 1], [row, col + 1], [row - 1, col], [row - 1, col + side], [row + 1, col], [row + 1, col + side]]
      .filter(([r, c]) => r >= 0 && c >= 0 && c < COLS);
  }

  _settleShot(shot, hit) {
    const occupied = new Set(this.board.map((ball) => cellKey(ball.row, ball.col)));
    let candidates = hit ? this._neighborCells(hit.row, hit.col) : Array.from({ length: COLS }, (_, col) => [0, col]);
    candidates = candidates.filter(([row, col]) => !occupied.has(cellKey(row, col)));
    if (!candidates.length) {
      candidates = this.board.flatMap((ball) => this._neighborCells(ball.row, ball.col))
        .filter(([row, col]) => !occupied.has(cellKey(row, col)));
    }
    if (!candidates.length) { this.projectile = null; this._finish('defeat'); return; }
    candidates.sort((a, b) => dist(pos(a[0], a[1]), shot) - dist(pos(b[0], b[1]), shot));
    const [row, col] = candidates[0];
    const added = this._ball(row, col, shot.color);
    added.appear = this.reducedMotion ? 1 : 0.86;
    this.board.push(added);
    this.projectile = null;
    this.state.shooting = false;
    this.state.currentColor = this.state.nextColor;
    this.state.nextColor = KEYS[(this.shots * 3 + Math.floor(this.shots / 2)) % KEYS.length];
    this.rings.push({ x: added.x, y: added.y, t: 0, duration: 0.22, color: added.color, radius: 19 });
    const group = this._connected(added, true);
    if (group.length >= 3) {
      const removedIds = new Set(group.map((ball) => ball.id));
      const remaining = this.board.filter((ball) => !removedIds.has(ball.id));
      const anchored = this._anchored(remaining);
      const falling = remaining.filter((ball) => !anchored.has(ball.id));
      this._removeGroup(group, falling, false);
    } else {
      this.state.combo = 0;
    }
    if (this.state.shotsUntilDrop <= 0) {
      this.state.shotsUntilDrop = 6;
      this._schedule(0.36, () => this._dropRow());
    }
    this._checkDanger();
    this._updateGuide();
    this._emit();
    if (!this.board.length) this._schedule(0.5, () => this._finish('victory'));
  }

  _connected(start, sameColor) {
    const map = new Map(this.board.map((ball) => [cellKey(ball.row, ball.col), ball]));
    const seen = new Set([start.id]);
    const queue = [start];
    for (let i = 0; i < queue.length; i += 1) {
      const ball = queue[i];
      this._neighborCells(ball.row, ball.col).forEach(([row, col]) => {
        const other = map.get(cellKey(row, col));
        if (other && !seen.has(other.id) && (!sameColor || other.color === start.color)) { seen.add(other.id); queue.push(other); }
      });
    }
    return queue;
  }

  _anchored(balls) {
    const map = new Map(balls.map((ball) => [cellKey(ball.row, ball.col), ball]));
    const queue = balls.filter((ball) => ball.row === 0);
    const seen = new Set(queue.map((ball) => ball.id));
    for (let i = 0; i < queue.length; i += 1) {
      this._neighborCells(queue[i].row, queue[i].col).forEach(([row, col]) => {
        const other = map.get(cellKey(row, col));
        if (other && !seen.has(other.id)) { seen.add(other.id); queue.push(other); }
      });
    }
    return seen;
  }

  _removeGroup(group, dropped = [], demo = false) {
    if (!group.length) return;
    const ids = new Set([...group, ...dropped].map((ball) => ball.id));
    const center = group.reduce((a, ball) => ({ x: a.x + ball.x / group.length, y: a.y + ball.y / group.length }), { x: 0, y: 0 });
    this.board = this.board.filter((ball) => !ids.has(ball.id));
    this.state.combo = demo ? Math.max(3, this.state.combo + 1) : this.time - this.comboWindow < 8 ? this.state.combo + 1 : 1;
    this.comboWindow = this.time;
    const points = group.length * 80 * this.state.combo + dropped.length * 120;
    this.state.score += points;
    group.forEach((ball) => this._burst(ball.x, ball.y, ball.color, 4));
    dropped.forEach((ball, index) => {
      this.falling.push({ ...ball, vy: this.reducedMotion ? 130 : 40 + index * 15, vx: this.reducedMotion ? 0 : (index % 2 ? 1 : -1) * (20 + index * 5), life: this.reducedMotion ? 0.32 : 1.3, spin: 0 });
    });
    this.rings.push({ ...center, t: 0, duration: 0.42, radius: 40, color: 'mint' });
    this.labels.push({ x: center.x, y: Math.max(290, center.y + 38), text: `${String(this.state.combo).padStart(2, '0')}  COMBO`, sub: `+${points.toLocaleString('en-US')}`, t: 0, duration: 1.25 });
    this.onEvent({ type: 'combo', combo: this.state.combo, score: points, removed: group.length, dropped: dropped.length, demo });
    this._updateGuide();
    this._emit();
  }

  _burst(x, y, color, count) {
    if (this.reducedMotion) return;
    for (let i = 0; i < count; i += 1) {
      const angle = (i / count * Math.PI * 2) + x * 0.013;
      const speed = 35 + (i % 3) * 15;
      this.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 12, size: 2.4 + i % 2, life: 0.5 + i * 0.025, maxLife: 0.65, gravity: 65, color, angle, spin: 1.2 });
    }
  }

  _dropRow() {
    if (this.state.status !== 'playing') return;
    this.rowMoving = this.reducedMotion ? 0 : 0.28;
    this.board.forEach((ball) => {
      const previousX = ball.x;
      ball.row += 1;
      Object.assign(ball, pos(ball.row, ball.col));
      ball.previousX = previousX;
      ball.shift = this.reducedMotion ? 0 : 1;
    });
    for (let col = 0; col < COLS; col += 1) {
      const ball = this._ball(0, col, KEYS[(Math.floor(col / 2) + this.shots) % KEYS.length]);
      ball.appear = this.reducedMotion ? 1 : 0.5;
      this.board.push(ball);
    }
    this._checkDanger();
    this._updateGuide();
    this._emit();
  }

  _checkDanger() {
    if (this.board.some((ball) => ball.y >= 592 - R)) { this._finish('defeat'); return; }
    if (this.board.some((ball) => ball.y > 535) && !this.state.dangerActive) {
      this.dangerPulse = 2.5;
      this.state.dangerActive = true;
      this.onEvent({ type: 'danger', active: true, demo: false });
    }
  }

  _finish(type, previewBall = false) {
    if (this.state.paused || this.state.status !== 'playing') return false;
    this.projectile = null;
    this.demoBusy = false;
    this.state.shooting = false;
    this.state.status = type;
    this.state.dangerPreview = false;
    const lowest = this.board.reduce((bottom, ball) => !bottom || ball.y > bottom.y ? ball : bottom, null);
    this.terminalEffect = {
      type,
      t: 0,
      duration: 0.72,
      previewBall: type === 'defeat' && previewBall,
      impactX: previewBall ? W * 0.61 : (lowest?.x ?? W / 2),
    };
    this.tasks = [];
    if (type === 'victory') {
      this.rings.push({ x: W / 2, y: H * 0.44, t: 0, duration: 0.7, radius: 185, color: 'gold' });
      if (!this.reducedMotion) {
        for (let i = 0; i < 9; i += 1) this._burst(120 + i * 50, 335 + Math.sin(i) * 35, i % 2 ? 'mint' : 'gold', 2);
      }
    } else {
      this.dangerPulse = 1.3;
      this.state.dangerActive = true;
    }
    this._schedule(0.72, () => this.onEvent({ type, score: this.state.score, elapsed: this.state.elapsed }));
    this._emit();
    return true;
  }

  _render() {
    if (!this.ctx || !this.canvas.width) return;
    const ctx = this.ctx;
    ctx.setTransform(this.canvas.width / W, 0, 0, this.canvas.height / H, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    // Fine, quiet space dust: no grid, bloom, or moving starfield.
    for (let i = 0; i < 31; i += 1) {
      const x = (i * 193 + 57) % W;
      const y = (i * 137 + 241) % 575 + 55;
      ctx.fillStyle = `rgba(154,178,185,${0.025 + i % 4 * 0.009})`;
      ctx.beginPath(); ctx.arc(x, y, i % 5 === 0 ? 1.1 : 0.65, 0, Math.PI * 2); ctx.fill();
    }
    this._drawGuide(ctx);
    const defeat = this.terminalEffect?.type === 'defeat' ? clamp(this.terminalEffect.t / 0.72, 0, 1) : 0;
    this.board.forEach((ball) => {
      ctx.save();
      ctx.globalAlpha = 1 - defeat * 0.35;
      const pop = ball.pulse > 0 && !this.reducedMotion ? 1 + Math.sin(ball.pulse / 0.22 * Math.PI) * 0.045 : 1;
      const slide = ball.shift ? Math.pow(ball.shift, 3) : 0;
      this._drawOrb(ctx, ball.x + ((ball.previousX ?? ball.x) - ball.x) * slide, ball.y - DY * slide, R * ball.appear * pop, ball.color);
      ctx.restore();
    });
    this.falling.forEach((ball) => {
      ctx.save();
      ctx.globalAlpha = clamp(ball.life / (this.reducedMotion ? 0.32 : 0.4), 0, 1) * 0.85;
      ctx.translate(ball.x, ball.y); ctx.rotate(ball.spin);
      this._drawOrb(ctx, 0, 0, R * 0.96, ball.color);
      ctx.restore();
    });
    this._drawEffects(ctx);
    this._drawDanger(ctx);
    this._drawTerminalImpact(ctx);
    this._drawLauncher(ctx);
    if (this.projectile) {
      const shot = this.projectile;
      if (!this.reducedMotion) shot.trail.forEach((p, i) => {
        ctx.globalAlpha = i / shot.trail.length * 0.09;
        ctx.fillStyle = ORB_COLORS[shot.color].base;
        ctx.beginPath(); ctx.arc(p.x, p.y, R * 0.8, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      this._drawOrb(ctx, shot.x, shot.y, R, shot.color);
    }
    this._drawLabels(ctx);
    if (this.terminalEffect && this.terminalEffect.t < 0.72) {
      const progress = this.terminalEffect.t / 0.72;
      ctx.globalAlpha = Math.sin(progress * Math.PI) * 0.045;
      ctx.fillStyle = this.terminalEffect.type === 'victory' ? '#9ebeb0' : '#ce8a7c';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  _drawOrb(ctx, x, y, radius, color) {
    const c = ORB_COLORS[color] || ORB_COLORS.mint;
    const gradient = ctx.createRadialGradient(x - radius * 0.25, y - radius * 0.3, radius * 0.1, x, y, radius * 1.12);
    gradient.addColorStop(0, c.light);
    gradient.addColorStop(0.65, c.base);
    gradient.addColorStop(1, c.dark);
    ctx.fillStyle = 'rgba(2,10,14,0.2)';
    ctx.beginPath(); ctx.ellipse(x, y + radius * 0.8, radius * 0.85, radius * 0.27, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = gradient;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
    // Pigment-embedded symbols remain legible without specular white highlights.
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(radius / R, radius / R);
    ctx.strokeStyle = c.ink;
    ctx.fillStyle = c.ink;
    ctx.globalAlpha *= 0.7;
    ctx.lineWidth = 1.75;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    if (color === 'coral') {
      ctx.arc(0, 0, 4.3, 0, Math.PI * 2);
    } else if (color === 'mint') {
      ctx.moveTo(0, -6); ctx.lineTo(5.3, 0); ctx.lineTo(0, 6); ctx.lineTo(-5.3, 0); ctx.closePath();
    } else if (color === 'gold') {
      for (let i = 0; i < 8; i += 1) {
        const angle = -Math.PI / 2 + i * Math.PI / 4;
        const length = i % 2 ? 2.1 : 6.4;
        const px = Math.cos(angle) * length;
        const py = Math.sin(angle) * length;
        if (!i) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    } else if (color === 'violet') {
      ctx.moveTo(0, -5.8); ctx.lineTo(5.5, 4.3); ctx.lineTo(-5.5, 4.3); ctx.closePath();
    } else if (color === 'blue') {
      ctx.moveTo(-1.8, -5.5); ctx.lineTo(1.8, -5.5); ctx.lineTo(1.8, -1.8);
      ctx.lineTo(5.5, -1.8); ctx.lineTo(5.5, 1.8); ctx.lineTo(1.8, 1.8);
      ctx.lineTo(1.8, 5.5); ctx.lineTo(-1.8, 5.5); ctx.lineTo(-1.8, 1.8);
      ctx.lineTo(-5.5, 1.8); ctx.lineTo(-5.5, -1.8); ctx.lineTo(-1.8, -1.8); ctx.closePath();
    } else {
      for (let i = 0; i < 5; i += 1) {
        const angle = -Math.PI / 2 + i * Math.PI * 2 / 5;
        const px = Math.cos(angle) * 3.25;
        const py = Math.sin(angle) * 3.25;
        ctx.moveTo(px + 2.6, py);
        ctx.arc(px, py, 2.6, 0, Math.PI * 2);
      }
      ctx.moveTo(2.4, 0); ctx.arc(0, 0, 2.4, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.restore();
  }

  _drawGuide(ctx) {
    if (this.state.status !== 'playing' || this.projectile) return;
    ctx.fillStyle = 'rgba(172,190,192,0.4)';
    this.guide.forEach((point, index) => {
      if (index < 2) return;
      ctx.globalAlpha = 1 - index / (this.guide.length + 4) * 0.68;
      ctx.beginPath(); ctx.arc(point.x, point.y, 1.6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    const endpoint = this.guide[this.guide.length - 1];
    if (endpoint) {
      ctx.strokeStyle = 'rgba(156,182,175,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(endpoint.x, endpoint.y, R - 2, 0, Math.PI * 2); ctx.stroke();
    }
  }

  _drawLauncher(ctx) {
    const recoil = this.reducedMotion ? 0 : Math.sin(this.recoil / 0.14 * Math.PI) * 5;
    ctx.save();
    ctx.translate(ORIGIN.x, ORIGIN.y + recoil);
    // A compact ceramic dial and single short barrel replace metallic ornament.
    ctx.fillStyle = 'rgba(2,9,13,0.28)';
    ctx.beginPath(); ctx.ellipse(0, 14, 48, 17, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b3d45';
    ctx.beginPath(); ctx.arc(0, 0, 42, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(159,185,181,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 41.5, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.rotate(this.angle);
    ctx.fillStyle = '#4f636c';
    ctx.beginPath();
    ctx.moveTo(7, -15); ctx.lineTo(39, -12); ctx.quadraticCurveTo(46, -12, 46, -6);
    ctx.lineTo(46, 6); ctx.quadraticCurveTo(46, 12, 39, 12); ctx.lineTo(7, 15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#19292f';
    ctx.beginPath(); ctx.ellipse(43, 0, 3.2, 9.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#31454b';
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
    if (!this.projectile && this.state.status === 'playing') {
      const scale = this.reducedMotion ? 1 : 0.7 + 0.3 * (1 - Math.pow(1 - this.load, 3));
      ctx.globalAlpha = this.load;
      this._drawOrb(ctx, 0, -1, R * scale, this.state.currentColor);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(155,176,179,0.3)';
    ctx.font = '10px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('移动瞄准 · 点击发射', W / 2, 752);
  }

  _drawDanger(ctx) {
    const active = this.state.dangerActive;
    const pulse = active && this.dangerPulse > 0 && !this.reducedMotion ? (Math.sin(this.time * 7) + 1) / 2 : 0.16;
    ctx.strokeStyle = active ? `rgba(203,135,122,${0.24 + pulse * 0.28})` : 'rgba(146,164,169,0.1)';

      ctx.textAlign = 'center';
      ctx.fillText('临界区域', W / 2, 617);
    }

      ctx.translate(particle.x, particle.y); ctx.rotate(particle.angle);

      ctx.globalAlpha = (1 - t) * 0.23;

    const effect = this.terminalEffect;
    if (!effect || effect.type !== 'defeat' || effect.t >= effect.duration) return;
    const impactAt = effect.previewBall && !this.reducedMotion ? 0.3 : 0;

      ctx.globalAlpha = (1 - wave) * 0.34;

      ctx.beginPath();
      ctx.ellipse(effect.impactX, 595, 12 + wave * 105, 1.5 + wave * 4, 0, 0, Math.PI * 2);

    ctx.restore();
  }

  _drawLabels(ctx) {
    this.labels.forEach((label) => {
      const t = label.t / label.duration;

      ctx.font = '500 21px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.fillText(label.text, label.x, label.y - drift);
      ctx.fillStyle = '#80958e';
      ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.fillText(label.sub, label.x, label.y + 23 - drift);
      ctx.restore();
    });
  }
}

return {OrbScene,ORB_COLORS};
})();

    };

  }

  _buildModel() {

    this.board = [
      orb(261.5, 0, 'coral'), orb(300.5, 0, 'gold'), orb(339.5, 0, 'blue'), orb(378.5, 0, 'violet'),
      orb(281, 1, 'rose'), orb(320, 1, 'coral'), orb(359, 1, 'gold'),
      orb(300.5, 2, 'mint'), orb(339.5, 2, 'mint'),
      orb(281, 3, 'gold'), orb(261.5, 4, 'violet'), orb(242, 5, 'blue'),
      orb(359, 3, 'coral'), orb(378.5, 4, 'rose'), orb(398, 5, 'gold'),

    this.joined = orb(320, 3, 'mint');
    const all = [...this.board, this.joined];
    const neighbors = ball => all.filter(other => other !== ball && pointDistance(ball, other) <= DX + 0.5);
    const collect = (seeds, canVisit) => {
      const visited = new Set(seeds.map(ball => ball.id));

  _setCaption(text) {

  _render() {

      ctx.fillStyle = ORB_COLORS.mint.base;

      ctx.fillText('连锁坠落', 320, 192);
      ctx.fillStyle = '#8c9bac'; ctx.font = '12px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.fillText(`${this.matched.size} 球消除  +  ${this.dropped.size} 球掉落`, 320, 220);
      ctx.restore();
    }
    this._setCaption(t >= 2.35 && t < 3.05 ? '三球连接，消除支撑。' : t >= 3.05 && t < 7.5 ? '一球命中，整串掉落。' : '瞄准同色，寻找连接。');
  }

  _drawBackdrop() {

  _drawAim(alpha) {

  _drawOrb(ball, scale = 1, rotation = 0) {

  _drawLauncher(color, recoil = 0, empty = false) {

    }
    ctx.restore();
  }
}

const $ = selector => document.querySelector(selector);
const formatNumber = value => Math.round(value).toString().padStart(6,'0');
const formatTime = value => Math.floor(value/60).toString().padStart(2,'0')+':'+Math.floor(value%60).toString().padStart(2,'0');
const symbols = {coral:'●',mint:'◆',gold:'✦',violet:'▲',blue:'✚',rose:'✿'};
const names = {coral:'珊瑚',mint:'青柠',gold:'金星',violet:'紫晶',blue:'晴蓝',rose:'玫红'};
const modes = {endless:'无尽模式',campaign:'闯关模式',timed:'限时挑战'};
const motionMedia = matchMedia('(prefers-reduced-motion: reduce)');
let reducedMotion = motionMedia.matches;
let audio = false;
let scene = null;
let home = null;
let state = {};
let activeView = 'home';
let gameMode = 'endless';
let lastScore = null;
let lastNextColor = null;
let loopToken = 0;
let looping = false;
let level = 7;
let fired = 0;
let soundContext;
let toastTimer;
const animations = new Set();

function animate(element, frames, options) {
  if (reducedMotion || !element?.animate) return;
  const animation = element.animate(frames,options);
  animations.add(animation);
  animation.onfinish = animation.oncancel = () => animations.delete(animation);
  return animation;
}
function setMotion(value) {
  reducedMotion=Boolean(value);
  document.body.classList.toggle('motion-reduced',reducedMotion);
  $('#motion-toggle').setAttribute('aria-pressed',String(reducedMotion));
  scene?.setReducedMotion(reducedMotion);
  home?.setReducedMotion(reducedMotion);
  if(reducedMotion){animations.forEach(animation=>animation.cancel());$('#toast').style.opacity='0';}
}
function toast(message) {
  const element=$('#toast');
  element.textContent=message;clearTimeout(toastTimer);
  element.style.opacity='1';element.style.transform='translate(-50%,0)';
  animate(element,[{opacity:0,transform:'translate(-50%,7px)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:180,easing:'ease-out'});
  toastTimer=setTimeout(()=>{element.style.opacity='0';},1800);
}
function sound(type) {
  if(!audio)return;
  try {
    const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return;
    soundContext ||= new AudioCtor();
    if(soundContext.state==='suspended')soundContext.resume();
    const oscillator=soundContext.createOscillator(),gain=soundContext.createGain(),t=soundContext.currentTime;
    oscillator.type='sine';oscillator.frequency.setValueAtTime(type==='shot'?300:560,t);
    oscillator.frequency.exponentialRampToValueAtTime(type==='shot'?140:900,t+.08);
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.018,t+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.14);
    oscillator.connect(gain).connect(soundContext.destination);oscillator.start(t);oscillator.stop(t+.15);
  }catch{audio=false;}
}
function updateState(value) {
  state=value;
  if(lastScore!==value.score){
    $('#score').textContent=formatNumber(value.score);
    if(lastScore!==null&&value.score>lastScore){
      $('#score-gain').textContent='+'+(value.score-lastScore);
      animate($('#score-gain'),[{opacity:0,transform:'translateY(4px)'},{opacity:1,offset:.2,transform:'translateY(0)'},{opacity:1,offset:.65,transform:'translateY(-2px)'},{opacity:0,transform:'translateY(-8px)'}],{duration:850,easing:'ease-out'});
      animate($('#score'),[{opacity:.65,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'ease-out'});
    }
    lastScore=value.score;
  }
  $('#elapsed').textContent=formatTime(value.elapsed);
  const shots=value.dangerPreview?1:Math.max(0,value.shotsUntilDrop);
  const warning=shots<=2;
  $('#shots').textContent=shots;$('#descent-fill').style.width=(Math.max(1,shots)/6*100)+'%';
  $('#danger-readout').classList.toggle('is-critical',warning);
  $('#danger-caption').textContent=shots<=1?'下一发后棋盘下压':warning?'留意下压节奏':'把握每一次角度';
  $('#play-status').textContent=value.status!=='playing'?'本局结束':value.paused?'已暂停':'进行中';
  if(lastNextColor!==value.nextColor){
    const orb=$('#next-orb');orb.className='next-orb '+value.nextColor;
    orb.style.setProperty('--orb',ORB_COLORS[value.nextColor].base);
    orb.setAttribute('aria-label','下一球：'+names[value.nextColor]);
    $('#next-symbol').textContent=symbols[value.nextColor];
    if(lastNextColor!==null)animate(orb,[{opacity:.3,transform:'translateY(4px) scale(.91)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:220,easing:'ease-out'});
    lastNextColor=value.nextColor;
  }
}
function modalData() {
  return {baseScore:state.score,score:state.score,elapsed:formatTime(state.elapsed||0),shots:fired,combo:state.combo||3,difficulty:'normal',mode:gameMode,level,stars:3,reducedMotion,audio};
}
const modals=new DemoModals($('#modal-root'),{onAction(action,detail){
  if(action==='reduceMotion'){setMotion(detail);return;}
  if(action==='audio'){audio=detail;if(audio)sound('combo');return;}
  if(action==='leaderboard'||action==='settings'){stopLoop();scene?.setPaused(true);home?.setPaused(true);return;}
  if(action==='home'){showHome();return;}
  if(action==='restart'||action==='next'){
    stopLoop();if(action==='next')level+=1;resetBoard();return;
  }
  if(action==='resume'||action==='close'){
    stopLoop();
    if(activeView==='home'){home.setPaused(false);return;}
    if(state.status!=='playing')resetBoard();else scene.setPaused(false);
  }
}});
function openModal(type,{automatic=false}={}) {
  if(!automatic)stopLoop();
  scene.setPaused(true);home?.setPaused(true);modals.show(type,modalData());
}
function sceneEvent(event) {
  if(event.type==='shot'){fired++;sound('shot');}
  if(event.type==='combo')sound('combo');
  if(event.type==='victory'||event.type==='defeat')openModal(event.type,{automatic:looping});
}
scene=new OrbScene($('#game'),{onState:updateState,onEvent:sceneEvent,reducedMotion});
home=new HomePreview($('#home-root'),{reducedMotion,onAction(action){
  if(action==='settings'||action==='leaderboard'||action==='help'||action==='lan'){openModal(action);return;}
  if(action==='motion'){enterGame('endless',true);return;}
  if(action==='campaign'||action==='timed'||action==='endless'||action==='continue')enterGame(action==='continue'?'endless':action,false);
}});
function resetBoard() {
  fired=0;lastScore=null;lastNextColor=null;modals.close();scene.reset();$('#score-gain').textContent='';
}
function stopLoop() {
  loopToken++;looping=false;
  $('#interaction-mode').textContent='观察循环动效';
  $('#tour-status').textContent='自由试玩 · 点击棋盘发射';
  $('#loop-indicator').classList.remove('is-looping');
}
function showHome() {
  stopLoop();modals.close();scene.setPaused(true);activeView='home';
  $('#app').hidden=true;home.setPaused(false);home.show();
  document.title='ORBBOUND 5.0.0 · Windows 首页预览';
}
function enterGame(mode='endless',observe=false) {
  stopLoop();home.hide();activeView='game';gameMode=mode;
  $('#app').hidden=false;
  const label=modes[mode]||modes.endless;
  $('#mode-name').textContent=label;
  document.title='ORBBOUND 5.0.0 · '+label+'预览';
  resetBoard();
  if(observe)startLoop();
}
function loopWait(duration,token) {
  return new Promise(resolve=>{
    let remaining=duration,last=null;
    const tick=now=>{
      if(token!==loopToken||activeView!=='game'){resolve(false);return;}
      if(last!==null&&!document.hidden)remaining-=Math.min(now-last,100);
      last=now;
      if(remaining<=0){resolve(true);return;}
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
async function startLoop() {
  stopLoop();looping=true;
  const token=loopToken;
  $('#interaction-mode').textContent='切换自由试玩';
  $('#loop-indicator').classList.add('is-looping');
  while(token===loopToken&&activeView==='game'){
    resetBoard();
    const steps=[['fire','发射与装填',1450],['demoCombo','连击与掉落',1600],['demoDanger','下压预警与触底线',2850],['demoVictory','通关与结算',2900],['demoDefeat','触底与结算',2600]];
    for(const [method,label,duration] of steps){
      if(token!==loopToken)return;
      if(method==='demoDefeat')resetBoard();
      $('#tour-status').textContent=label+' · 自动循环';
      scene[method]();
      if(!await loopWait(duration,token))return;
    }
    resetBoard();$('#tour-status').textContent='下一轮 · 自动循环';
    if(!await loopWait(1000,token))return;
  }
}
$('#interaction-mode').addEventListener('click',()=>{
  if(looping){stopLoop();resetBoard();}
  else startLoop();
});
$('#return-home').addEventListener('click',showHome);
$('#game-brand').addEventListener('click',event=>{event.preventDefault();showHome();});
$('#motion-toggle').addEventListener('click',()=>setMotion(!reducedMotion));
motionMedia.addEventListener('change',event=>setMotion(event.matches));
$('#game').addEventListener('pointerdown',()=>{
  if(looping){stopLoop();resetBoard();}
},true);
document.querySelectorAll('[data-action]').forEach(button=>{
  button.setAttribute('aria-label',button.children[1].textContent);
  button.addEventListener('click',()=>{
    const type=button.dataset.action;
    if(type==='restart'){stopLoop();resetBoard();toast('新一局，重新出发。');}
    else openModal(type);
  });
});
document.addEventListener('keydown',event=>{
  if(event.ctrlKey||event.altKey||event.metaKey||event.repeat||modals.isOpen)return;
  if(event.target instanceof HTMLInputElement||event.target instanceof HTMLTextAreaElement)return;
  const key=event.key.toLowerCase();
  if(key==='s'){event.preventDefault();openModal('settings');return;}
  if(key==='h'){event.preventDefault();openModal('leaderboard');return;}
  if(key==='i'){event.preventDefault();openModal('help');return;}
  if(activeView!=='game')return;
  if(key==='escape'){event.preventDefault();showHome();return;}
  if(key==='p'){event.preventDefault();openModal('pause');return;}
  if(key==='r'){event.preventDefault();stopLoop();resetBoard();return;}
  if(event.code==='Space'){
    if(event.target instanceof HTMLButtonElement)return;
    event.preventDefault();if(looping){stopLoop();resetBoard();}scene.fire();
  }
});
let resumeOnVisible=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){resumeOnVisible=activeView==='game'&&!state.paused;scene.setPaused(true);}
  else if(resumeOnVisible&&!modals.isOpen&&activeView==='game'){resumeOnVisible=false;scene.setPaused(false);}
});
window.addEventListener('pagehide',()=>{stopLoop();scene.destroy();home.destroy();modals.destroy();soundContext?.close();},{once:true});
setMotion(reducedMotion);
showHome();

</script>
