<!doctype html>
<html lang="zh-CN" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1221" />
    <style>html,body{margin:0;background:#0d1221}.booting #app{visibility:hidden}</style>
    <title>Orbbound · 泡泡消除</title>
  </head>
  <body>
    <div id="app">
      <section id="home-screen" class="screen home-screen">
        <div class="home-topline">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-name">ORBBOUND</span>
          <span class="version-pill"></span>
        </div>

        <div class="home-content">
          <div class="hero-copy">
            <p class="eyebrow">A SMALL STRATEGY PUZZLE</p>
            <h1><span class="hero-line">瞄准，</span><span class="hero-line"><em>让它掉落。</em></span></h1>
            <p class="hero-description">同色相连，轻松消除。<br>切断支撑，让悬空球一起掉落。</p>
            <div class="hero-notes" aria-label="游戏特色">
              <span><b>01</b> 瞄准反弹</span>
              <span><b>02</b> 三枚消除</span>
              <span><b>03</b> 悬空掉落</span>
            </div>
          </div>

          <div class="home-card"></div>
        </div>

        <footer class="home-footer">
          <span>原创消除游戏 · 无需联网</span>
          <span id="home-high-score">最高分 00000</span>
          <div>
            <button id="tutorial-button" class="text-button" type="button">玩法说明</button>
            <button id="settings-button" class="text-button" type="button">设置</button>
            <button data-history class="text-button" type="button">历史与排行</button>
          </div>
        </footer>
      </section>

      <section id="game-screen" class="screen game-screen" hidden>
        <div class="mobile-topbar">
          <div class="mobile-menu"><button id="mobile-menu-button" class="icon-button" aria-label="游戏菜单" type="button">☰</button><button id="mobile-pause-button" class="icon-button" aria-label="存档并返回首页" type="button">存档</button></div>
          <button id="mobile-help-button" class="quiet-button" type="button">玩法提示</button>
        </div>
        <header class="game-header">
          <div class="header-brand"><span class="brand-mark small" aria-hidden="true"><i></i><i></i><i></i></span><span>ORBBOUND</span></div>
          <div class="header-stat score-stat"><small>得分</small><strong id="score-value">00000</strong></div>
          <div class="header-stat danger-stat">
            <small id="descent-caption">距离棋盘下降</small>
            <div class="countdown-label"><small id="shot-countdown-label" hidden>次数</small><strong id="danger-value">再发射 10 次</strong></div>
            <div class="danger-meter" role="progressbar" aria-label="下落次数倒计时" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="danger-fill"></span></div>
            <div id="descent-time-row" hidden>
              <div class="countdown-label"><small>本回合</small><strong id="descent-time-value">30 秒</strong></div>
              <div class="danger-meter time-meter" role="progressbar" aria-label="下落时间倒计时" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span id="descent-time-fill"></span></div>
            </div>
          </div>
          <button id="pause-button" class="icon-button" type="button" aria-label="暂停">Ⅱ</button>
          <div class="header-stat"><small>本局用时</small><strong id="round-clock">00:00</strong></div>
          <div class="current-card"><small id="side-orb-label">当前发射</small><div id="current-orb-preview" class="dom-orb"></div><p>← → 长按加速 · 空格发射</p></div>
          <div class="mobile-launch-row"><button id="launch-button" class="primary-button compact" type="button"><span>发射</span><b>↑</b></button></div>
        </header>

        <main class="game-layout">
          <section class="board-wrap">
            <div class="board-heading"><span id="difficulty-label">经典 · 第 1 回合</span><span id="game-status-label">选择角度</span></div>
            <div id="game-container" class="game-container" aria-label="Orbbound 游戏棋盘"></div>
          </section>

          <aside class="game-sidebar">
            <div class="sidebar-card next-card">
              <div class="card-kicker">下一球</div>
              <div class="next-preview"><div id="next-orb-preview" class="dom-orb"></div></div>
              <p>下一枚已经准备好</p>
            </div>
            <div class="sidebar-card legend-card">
              <div class="card-kicker">游玩提示</div>
              <div class="legend-row"><span class="legend-icon">3+</span><div><strong>同色消除</strong><small>三个相邻同色球即可消除</small></div></div>
              <div class="legend-row"><span class="legend-icon slash">↘</span><div><strong>悬空掉落</strong><small>失去顶部支撑，不分颜色掉落</small></div></div>
              <div class="legend-row"><span class="legend-icon warn">!</span><div><strong>留意剩余发射次数</strong><small>倒计时归零，棋盘下降一行</small></div></div>
            </div>
            <div class="sidebar-actions">
              <button id="settle-button" class="side-button" type="button">结算本局 <span>✓</span></button>
              <button id="restart-button" class="side-button" type="button">重新开始 <span>R</span></button>
              <button id="game-settings-button" class="side-button" type="button">游戏设置 <span>⚙</span></button>
              <button data-history class="side-button" type="button">历史与排行 <span>↗</span></button>
              <button id="back-home-button" class="side-button muted" type="button">返回首页 <span>⌂</span></button>
            </div>
          </aside>
        </main>
        <div class="mobile-controls" role="group" aria-label="炮口控制">
          <div class="mobile-fire-group"><button id="mobile-fire" class="primary-button" type="button"><span aria-hidden="true">↑</span><small>发射</small></button></div>
          <div class="steering-sliders">
            <label class="steering-control">炮口方向 <output id="aim-angle">0°</output><input id="aim-slider" type="range" min="-78" max="78" step="0.1" value="0" aria-label="炮口方向" /></label>
            <label class="steering-control fine-control">左微调 · 松手停 · 右微调<input id="fine-slider" type="range" min="-100" max="100" value="0" aria-label="左右微调，越靠两侧越快" /></label>
          </div>
        </div>
      </section>

      <div id="modal-root" class="modal-root" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
